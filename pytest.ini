[pytest]
# Gamma ships two independent services, each exporting a top-level package
# literally named `src`:
#
#     ocsf_normalizer/src        (normalizer tests)
#     revalidation_service/src   (re-validation tests)
#
# Only one `src` can be importable per interpreter, so these two suites cannot
# be collected in a single pytest process: whichever lands on sys.path first
# shadows the other, and the second suite fails to import with
# ModuleNotFoundError. That is why this file collects the normalizer suite only;
# the re-validation suite is run from its own directory, which carries its own
# pytest.ini.
#
# The consequence is worth stating plainly: a bare `pytest` at the repo root
# runs the normalizer suite only. To run both suites in one command:
#
#     python run_tests.py
#
# which is what CI invokes.
testpaths = ocsf_normalizer/tests
