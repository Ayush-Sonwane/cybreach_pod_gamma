name: Pod Gamma CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      # Both services export a top-level package named `src`, so their suites
      # cannot be collected in one pytest process. run_tests.py runs each from
      # its own directory; the previous inline `pytest` + `cd ... && pytest`
      # pair did the same thing but relied on the root pytest.ini's testpaths
      # and gave no indication of why it was split this way.
      run: |
        python run_tests.py